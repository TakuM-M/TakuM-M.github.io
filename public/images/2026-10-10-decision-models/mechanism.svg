<text x="311.0" y="96.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-family="ui-monospace, 'SF Mono', Menlo, monospace" >label</text>
<line x1="345" y1="80" x2="355" y2="80" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/>
