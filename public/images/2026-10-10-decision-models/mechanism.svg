<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" role="img" aria-label="LLM と判定モデルの推論の違い" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic', 'IPAGothic', sans-serif">
<title>LLM と判定モデルの推論の違い</title>
<rect width="680" height="520" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="20.0" y="30.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="bold" >(a) LLM：答えを 1 トークンずつ書く</text>
<rect x="20" y="50" width="150" height="60" rx="8" fill="#f4f3ef" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="95.0" y="75.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >プロンプト</text>
<text x="95.0" y="96.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" >指示文 + ログ</text>
<rect x="200" y="50" width="66" height="60" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="233.0" y="74.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" >1 回目</text>
<text x="233.0" y="96.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-family="ui-monospace, 'SF Mono', Menlo, monospace" >{"</text>
