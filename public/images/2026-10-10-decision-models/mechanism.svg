<text x="545.0" y="74.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" >5 回目</text>
<text x="545.0" y="96.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-family="ui-monospace, 'SF Mono', Menlo, monospace" >ormance</text>
<line x1="579" y1="80" x2="589" y2="80" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="590" y="50" width="66" height="60" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="623.0" y="74.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" >6 回目</text>
<text x="623.0" y="96.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-family="ui-monospace, 'SF Mono', Menlo, monospace" >"}</text>
<line x1="170" y1="80" x2="198" y2="80" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="200.0" y="138.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >出したトークンを入力の末尾に足して、もう 1 回モデルを通す</text>
<text x="200.0" y="158.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >→ 出力が長いほど推論の回数が増える。確率もトークン単位でしか出ない</text>
<line x1="20" y1="205" x2="660" y2="205" stroke="#e1e0d9"/>
<text x="20.0" y="235.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="bold" >(b) 判定モデル：1 回通して、全選択肢の確率を返す</text>
<rect x="20" y="255" width="170" height="70" rx="8" fill="#f4f3ef" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="105.0" y="280.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-family="ui-monospace, 'SF Mono', Menlo, monospace" >state</text>
<text x="105.0" y="302.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" >判定したいテキスト</text>
<rect x="20" y="340" width="170" height="90" rx="8" fill="#f4f3ef" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="105.0" y="365.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-family="ui-monospace, 'SF Mono', Menlo, monospace" >questions</text>
<text x="105.0" y="387.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" >型（choice など）</text>
<text x="105.0" y="407.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" >選択肢とその説明</text>
