<text x="548.0" y="331.0" font-size="12" fill="#898781" text-anchor="start" font-weight="normal" >0.01</text>
<text x="532.0" y="359.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="normal" font-family="ui-monospace, 'SF Mono', Menlo, monospace" >shipping</text>
