<text x="280.0" y="330.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold" >本体</text>
<text x="280.0" y="350.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" >エンコーダ等</text>
<text x="280.0" y="370.0" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="bold" >1 回だけ通す</text>
<line x1="336" y1="345" x2="362" y2="345" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="364" y="310" width="60" height="70" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="394.0" y="340.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" >判定</text>
<text x="394.0" y="358.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" >ヘッド</text>
